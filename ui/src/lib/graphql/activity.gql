# Everything ActivityFeed shows and TransactionEditForm edits.
fragment ActivityTransaction on Transaction {
	id
	type
	time
	units
	price {
		amount
		currency
	}
	fees {
		amount
		currency
	}
	taxes {
		amount
		currency
	}
	cashDelta {
		amount
		currency
	}
	gain {
		amount
		currency
	}
	fxRate
	security {
		id
		displayName
	}
	portfolio {
		id
		displayName
	}
	cashAccount {
		id
		displayName
	}
	document {
		id
		filename
	}
}
