query PortfolioDetail($id: ID!) {
	portfolio(id: $id) {
		id
		displayName
		cashAccount {
			id
			displayName
		}
		snapshot {
			totalPurchaseValue {
				amount
				currency
			}
			totalMarketValue {
				amount
				currency
			}
			totalProfitOrLoss {
				amount
				currency
			}
			totalGains
			performance(period: ALL_TIME) {
				timeWeightedReturn
			}
			positions {
				...HoldingPosition @mask_disable
			}
		}
		transactions {
			id
			type
			time
			units
			price {
				amount
				currency
			}
			fees {
				amount
				currency
			}
			taxes {
				amount
				currency
			}
			cashDelta {
				amount
				currency
			}
			fxRate
			security {
				id
				displayName
			}
			cashAccount {
				id
			}
		}
	}
	securities {
		id
		displayName
	}
	cashAccounts {
		id
		displayName
		currency
	}
}
