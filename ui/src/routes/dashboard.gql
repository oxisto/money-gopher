query Dashboard {
	portfolios @list(name: "All_Portfolios") {
		id
		displayName
		snapshot {
			totalMarketValue {
				amount
				currency
			}
			totalPurchaseValue {
				amount
				currency
			}
			totalProfitOrLoss {
				amount
				currency
			}
			totalGains
			performance(period: YEAR_TO_DATE) {
				timeWeightedReturn
			}
			positions {
				security {
					id
					displayName
				}
				marketValue {
					amount
					currency
				}
			}
		}
		transactions {
			...OverviewTransaction @mask_disable
		}
	}
	cashAccounts @list(name: "All_CashAccounts") {
		id
		displayName
		currency
		balance {
			amount
			currency
		}
		transactions {
			...OverviewTransaction @mask_disable
		}
	}
	realizedGains {
		dividends {
			amount
			currency
		}
		interest {
			amount
			currency
		}
		tradingGains {
			amount
			currency
		}
		total {
			amount
			currency
		}
		entries {
			id
			time
			type
			amount {
				amount
				currency
			}
		}
	}
	documents(state: PARSED) {
		id
		filename
		transactionDate
		suggestedCashAccount {
			displayName
		}
		stagedTransactions {
			type
			units
			cashDelta {
				amount
				currency
			}
			calculatedCashDelta {
				amount
				currency
			}
			securityHint
			security {
				displayName
			}
		}
	}
}

fragment OverviewTransaction on Transaction {
	id
	type
	time
	units
	cashDelta {
		amount
		currency
	}
	gain {
		amount
		currency
	}
	security {
		displayName
	}
	portfolio {
		displayName
	}
	cashAccount {
		displayName
	}
}
