query TransactionDetail($id: ID!) {
	transaction(id: $id) {
		id
		type
		time
		units
		price {
			amount
			currency
		}
		fees {
			amount
			currency
		}
		taxes {
			amount
			currency
		}
		cashDelta {
			amount
			currency
		}
		gain {
			amount
			currency
		}
		fxRate
		source
		portfolio {
			id
			displayName
		}
		cashAccount {
			id
			displayName
		}
		security {
			id
			displayName
			identifiers {
				kind
				value
			}
		}
		document {
			id
			filename
			contentType
			state
			detectedBank
			createdAt
		}
	}
}
