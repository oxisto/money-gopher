query Holdings {
	portfolios {
		id
		displayName
		snapshot {
			totalMarketValue {
				amount
				currency
			}
			totalPurchaseValue {
				amount
				currency
			}
			totalProfitOrLoss {
				amount
				currency
			}
			performance(period: ALL_TIME) {
				timeWeightedReturn
			}
			positions {
				...HoldingPosition @mask_disable
			}
		}
	}
}

fragment HoldingPosition on Position {
	security {
		id
		displayName
		identifiers {
			kind
			value
		}
	}
	units
	purchasePrice {
		amount
		currency
	}
	marketPrice {
		amount
		currency
	}
	purchaseValue {
		amount
		currency
	}
	marketValue {
		amount
		currency
	}
	profitOrLoss {
		amount
		currency
	}
}
