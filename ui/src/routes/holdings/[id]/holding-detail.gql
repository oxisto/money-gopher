query HoldingDetail($id: ID!) {
	security(id: $id) {
		id
		displayName
		identifiers {
			kind
			value
		}
		underlyingSecurity {
			id
			displayName
		}
		listings {
			id
			exchange
			ticker
			currency
			quoteProvider
			latestQuote {
				time
				price {
					amount
					currency
				}
			}
			quotes {
				time
				price {
					amount
					currency
				}
			}
		}
	}
	portfolios {
		id
		displayName
		snapshot {
			totalMarketValue {
				amount
				currency
			}
			positions {
				...HoldingPosition @mask_disable
			}
		}
		transactions {
			id
			type
			time
			units
			price {
				amount
				currency
			}
			fees {
				amount
				currency
			}
			taxes {
				amount
				currency
			}
			cashDelta {
				amount
				currency
			}
			gain {
				amount
				currency
			}
			security {
				id
				displayName
			}
		}
	}
}
