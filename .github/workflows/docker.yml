name: Docker

# The image is what a release ships. Building it on every PR cost more
# than it caught: it only breaks when the Dockerfile or the dependencies
# change. So it runs on pushes to main, before any release could pick
# the commit up, and on pull requests that touch what it is built from.
on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - go.mod
      - go.sum
      - ui/package.json
      - ui/package-lock.json

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
