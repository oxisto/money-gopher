name: Build

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check generated code is up to date
        run: |
          # Pinned: sqlc writes its version into every generated file, so CI
          # must run the same one as whoever last ran go generate.
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go generate ./...
          git diff --exit-code
      - name: Build
        run: go build -v ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -coverprofile=coverage.cov -covermode=atomic ./...
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.cov
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check GraphQL types are up to date
        run: |
          npm run generate
          git diff --exit-code src/lib/graphql/graphql-env.d.ts
      - name: Check
        run: npm run check
      - name: Build
        run: npm run build
