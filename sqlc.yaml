version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/persistence/sql/queries"
    schema: "internal/persistence/sql/migrations"
    gen:
      go:
        package: "persistence"
        out: "internal/persistence"
        emit_result_struct_pointers: true
        overrides:
          - db_type: "datetime"
            go_type: "time.Time"
